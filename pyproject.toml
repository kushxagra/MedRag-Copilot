[project]
name = "medrag-copilot"
version = "0.1.0"
description = ""
authors = [
    {name = "kushxagra",email = "kdwivedi1405@gmail.com"}
]
license = "MIT"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "biopython (>=1.88,<2.0)",
    "sentence-transformers (>=6.0.0,<7.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-community (<0.4.2)",
    "torch (>=2.13.0,<2.14.0)"
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"